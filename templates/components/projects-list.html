{% component projects_list(data) %}
{% if data.show_projects %}
<div class="container animate">
  <div class="row">
    {% set section = get_section(path="projects/_index.md") %}
    {% for page in section.pages %}
    {{<project_card data={page} />}}
    {% endfor %}
  </div>
</div>
{% endif %}
{% endcomponent projects_list %}
