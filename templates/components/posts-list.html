{% component posts_list(data) %}
{% if data.show_posts %}
<div class="container animate">
  <div class="row" data-pagebreak="6">
    {% for page in paginator.pages | default(value=section.pages) %}
      {{<blog_card data={page} />}}
    {% endfor %}
  </div>
</div>
{{<pagination />}}
{% endif %}
{% endcomponent posts_list %}
